version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: school-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: school-management
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      target: backend
    container_name: school-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/school-management
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/backend/uploads

  frontend:
    build:
      context: .
      target: frontend
    container_name: school-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
